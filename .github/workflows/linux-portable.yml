name: Linux portable foundation
on:
  # One portable run per commit. A release branch is validated by its pull request to main
  # (every push re-runs it), so a push run there would only duplicate it. Other branches,
  # main and tags keep their push runs; any ref can still be run by hand.
  push:
    branches-ignore: ['release/**']
    tags: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    env:
      OLIVE_DATA_DIR: /tmp/olive-ci-profile
      OLIVE_OLLAMA_HOST: http://127.0.0.1:1
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install Qt import runtime
        run: |
          cat /etc/os-release
          sudo apt-get update
          # QtGui and the preview's QtWebEngineCore link these even offscreen.
          # Resolved with ldd in a minimal Ubuntu userspace; no XCB plugin/GPU needed.
          packages=(libegl1 libgl1 libxkbcommon0 libfontconfig1 libglib2.0-0t64
                    libdbus-1-3 libnss3 libxcomposite1 libxdamage1 libxfixes3
                    libxrandr2 libxtst6 libasound2t64 libxkbfile1)
          apt-cache policy "${packages[@]}"
          sudo apt-get install --no-install-recommends -y "${packages[@]}"
      - run: python -m pip install -r requirements.txt -r requirements-mail-test.txt -r requirements-studio.txt
      - name: Verify headless Qt and Studio providers
        run: |
          python -c "from PySide6.QtWidgets import QApplication; app = QApplication([]); assert app.platformName() == 'offscreen'"
          python -c "from PySide6.QtWebEngineCore import QWebEngineUrlRequestInterceptor"
          python -c "import pylsp, pyflakes, autopep8"
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -v
      - run: npm ci
        working-directory: desktop
      - run: node node_modules/electron/install.js
        working-directory: desktop
      - run: npm run typecheck && npm run lint && npm test && npm run build
        working-directory: desktop
      # Native KDE/Wayland and GPU acceptance: see docs/archive/linux/LINUX_L3_REPORT.md.
      # Headless CI does not certify native dialogs, compositor behavior or Win32.
