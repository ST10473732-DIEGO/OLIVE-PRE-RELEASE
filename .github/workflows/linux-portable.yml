name: Linux portable foundation
on: [push, pull_request]
jobs:
  portable:
    runs-on: ubuntu-latest
    env:
      OLIVE_DATA_DIR: /tmp/olive-ci-profile
      OLIVE_OLLAMA_HOST: http://127.0.0.1:1
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: python -m pip install -r requirements.txt -r requirements-mail-test.txt -r requirements-studio.txt
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -v
      - run: npm ci
        working-directory: desktop
      - run: node node_modules/electron/install.js
        working-directory: desktop
      - run: npm run typecheck && npm run lint && npm test && npm run build
        working-directory: desktop
      # Native KDE/Wayland and GPU acceptance: linux-l1.spec.ts / linux-l2.spec.ts.
      # Headless CI does not certify native dialogs, compositor behavior or Win32.
