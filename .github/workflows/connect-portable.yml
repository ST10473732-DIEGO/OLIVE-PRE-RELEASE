name: Connect portable security
on: [push, pull_request]
jobs:
  connect:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install "cryptography>=50.0.1,<51" "pyOpenSSL>=26.0,<27" "psutil>=7,<8" "zeroconf>=0.151.3,<0.152"
      - run: python -m unittest tests.test_connect tests.test_connect_pairing tests.test_connect_network tests.test_connect_process tests.test_connect_workspace -v
      # Real sockets and independent synthetic profiles; no multicast requirement.
      # Actual mDNS acceptance is opt-in: python scripts/check_connect_lan.py.
