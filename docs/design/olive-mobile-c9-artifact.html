<title>OLIVE Mobile</title>
<style>
/* ============================= TOKENS ============================= */
:root{
  --bg:#0b0f16; --surface:#11171f; --elevated:#182029; --raised:#1f2933;
  --text:#e8eef7; --muted:#9db0c7; --faint:#6f819a;
  --accent:#7cc4ff; --accent-strong:#3d9cf5; --accent-soft:rgba(124,196,255,.12); --accent-glow:rgba(124,196,255,.28);
  --on-accent:#06131f;
  --line:rgba(197,216,240,.09); --line-strong:rgba(197,216,240,.16); --hover:rgba(197,216,240,.06);
  --field:rgba(9,13,20,.55);
  --success:#7fd8a8; --success-soft:rgba(127,216,168,.14);
  --warning:#f0c36b; --warning-soft:rgba(240,195,107,.14);
  --error:#ff8f8f; --error-soft:rgba(255,143,143,.14);
  --olive:#9ab534; --olive-glow:rgba(154,181,52,.16); --pimento:#c0232a;
  --shadow:0 18px 50px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.35);
  --radius:14px; --radius-sm:9px; --radius-lg:20px;
  --fast:140ms; --ease:cubic-bezier(.2,.7,.2,1);
  --font:-apple-system,"SF Pro Text","SF Pro Display",system-ui,"Segoe UI",sans-serif;
  --font-display:-apple-system,"SF Pro Display",system-ui,sans-serif;
  --mono:"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#eef1f6; --surface:#ffffff; --elevated:#eef2f8; --raised:#ffffff;
    --text:#141d29; --muted:#54637a; --faint:#78889f;
    --accent:#1e63c8; --accent-strong:#1554b3; --accent-soft:rgba(30,99,200,.1); --accent-glow:rgba(30,99,200,.22);
    --on-accent:#ffffff;
    --line:rgba(20,32,47,.1); --line-strong:rgba(20,32,47,.16); --hover:rgba(20,32,47,.05);
    --field:rgba(255,255,255,.9);
    --success:#1c7a4c; --success-soft:rgba(28,122,76,.12);
    --warning:#8a5a0b; --warning-soft:rgba(138,90,11,.12);
    --error:#b3303a; --error-soft:rgba(179,48,58,.1);
    --olive:#5f7016; --olive-glow:rgba(95,112,22,.12); --pimento:#b31f26;
    --shadow:0 18px 50px rgba(20,32,47,.16),0 2px 8px rgba(20,32,47,.06);
  }
}
:root[data-theme="light"]{
  --bg:#eef1f6; --surface:#ffffff; --elevated:#eef2f8; --raised:#ffffff;
  --text:#141d29; --muted:#54637a; --faint:#78889f;
  --accent:#1e63c8; --accent-strong:#1554b3; --accent-soft:rgba(30,99,200,.1); --accent-glow:rgba(30,99,200,.22);
  --on-accent:#ffffff;
  --line:rgba(20,32,47,.1); --line-strong:rgba(20,32,47,.16); --hover:rgba(20,32,47,.05);
  --field:rgba(255,255,255,.9);
  --success:#1c7a4c; --success-soft:rgba(28,122,76,.12);
  --warning:#8a5a0b; --warning-soft:rgba(138,90,11,.12);
  --error:#b3303a; --error-soft:rgba(179,48,58,.1);
  --olive:#5f7016; --olive-glow:rgba(95,112,22,.12); --pimento:#b31f26;
  --shadow:0 18px 50px rgba(20,32,47,.16),0 2px 8px rgba(20,32,47,.06);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased;padding-inline:16px}
[hidden]{display:none!important}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.icon{width:18px;height:18px;display:inline-flex;flex-shrink:0}
.icon svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.icon.filled svg{fill:currentColor;stroke:none}
::selection{background:var(--accent-glow)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ============================= LAYOUT SHELL ============================= */
.stage{max-width:1180px;margin:0 auto;padding-block:28px 48px;display:flex;flex-direction:column;gap:22px}
.stage-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand-mark{width:38px;height:38px;border-radius:11px;background:radial-gradient(circle at 32% 28%,color-mix(in srgb,var(--olive) 88%,white 6%),var(--olive) 60%);position:relative;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.brand-mark::after{content:"";position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--pimento);box-shadow:0 0 0 1.5px rgba(0,0,0,.18)}
.stage-head h1{font-family:var(--font-display);font-size:19px;font-weight:650;letter-spacing:-.01em}
.stage-head .sub{font-size:12.5px;color:var(--muted)}
.stage-head .tag{margin-left:auto;font-size:11px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);border:1px solid var(--line-strong);border-radius:999px;padding:4px 10px}
.layout{display:grid;grid-template-columns:minmax(0,420px) minmax(280px,340px);gap:26px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:1fr}}

/* ============================= PHONE CHROME ============================= */
.phone-wrap{position:sticky;top:20px;display:flex;justify-content:center}
@media (max-width:900px){.phone-wrap{position:static}}
.phone{
  width:min(390px,calc(100vw - 32px));
  aspect-ratio:390/844;
  background:#000; border-radius:52px; padding:12px;
  box-shadow:var(--shadow),0 0 0 1px rgba(255,255,255,.04) inset;
  position:relative;
}
.phone-screen{
  position:relative; height:100%; width:100%; border-radius:40px; overflow:hidden;
  background:var(--bg); display:flex; flex-direction:column; isolation:isolate;
  font-size:13.5px;
}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:34%;height:22px;background:#000;border-radius:0 0 16px 16px;z-index:60}
.statusbar{position:relative;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:8px 24px 2px;font-size:12.5px;font-weight:650;color:var(--text);flex-shrink:0;font-variant-numeric:tabular-nums}
.statusbar .sb-icons{display:flex;align-items:center;gap:5px;color:var(--text)}
.home-indicator{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:118px;height:4px;border-radius:3px;background:var(--text);opacity:.55;z-index:60}

.screen-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.screen-body::-webkit-scrollbar{width:0;height:0}

/* nav bar (drill-down) */
.navbar{display:flex;align-items:center;gap:6px;padding:8px 8px 10px;flex-shrink:0;min-height:38px}
.navbar h2{font-size:16.5px;font-weight:650;letter-spacing:-.005em;flex:1;text-align:center;margin-right:34px}
.navbar.left h2{text-align:left;margin-right:0;padding-left:6px}
.nav-back{display:inline-flex;align-items:center;gap:2px;color:var(--accent);background:none;border:0;padding:4px 4px 4px 2px;min-height:30px;font-size:14.5px;font-weight:500}
.nav-back .icon{width:22px;height:22px}
.nav-action{background:none;border:0;color:var(--accent);font-size:14.5px;font-weight:500;padding:4px 6px;min-height:30px}
.nav-title-big{padding:2px 14px 8px;flex-shrink:0}
.nav-title-big h1{font-family:var(--font-display);font-size:26px;font-weight:700;letter-spacing:-.02em}

/* tab bar */
.tabbar{display:flex;align-items:stretch;border-top:1px solid var(--line);background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(14px);flex-shrink:0;padding-bottom:2px}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;border-radius:0;color:var(--faint);padding:6px 2px 4px;min-height:48px;font-size:10px;font-weight:600}
.tabbar button .icon{width:21px;height:21px}
.tabbar button.active{color:var(--accent)}

/* ============================= COMPONENTS (reused desktop tokens) ============================= */
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.row{display:flex;align-items:center;gap:10px}
.spread{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.spacer{flex:1;min-width:0}

.pad{padding:12px 14px}
.section{padding:14px 14px 4px}
.section-title{display:flex;align-items:center;gap:8px;padding:0 2px 8px}
.section-title h3{font-size:13px;font-weight:650}
.section-title .link{margin-left:auto;font-size:12.5px;color:var(--accent);font-weight:500;background:none;border:0;padding:2px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.card + .card{margin-top:10px}
.card-pad{padding:13px 14px}
.card-row{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:0;border-radius:0;padding:12px 14px;min-height:0}
.card-row:not(:last-child){border-bottom:1px solid var(--line)}
.card-row:active{background:var(--hover)}
.card-row strong{display:block;font-weight:600;font-size:13.5px}
.card-row small{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.chev{color:var(--faint);flex-shrink:0}

.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:11px;font-size:11px;font-weight:650;background:var(--elevated);color:var(--muted);white-space:nowrap}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0}
.pill[data-tone="online"]{color:var(--success);background:var(--success-soft)}
.pill[data-tone="busy"]{color:var(--warning);background:var(--warning-soft)}
.pill[data-tone="busy"] .dot{animation:pulse 1.1s ease-in-out infinite}
.pill[data-tone="offline"]{color:var(--faint);background:var(--elevated)}
.pill[data-tone="waiting"]{color:var(--accent);background:var(--accent-soft)}
.pill[data-tone="waiting"] .dot{animation:pulse 1.1s ease-in-out infinite}
.pill[data-tone="revoked"]{color:var(--faint);background:transparent;border:1px dashed var(--line-strong)}
.pill[data-tone="off"]{color:var(--faint);background:transparent;border:1px solid var(--line-strong)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:700;background:var(--accent-soft);color:var(--accent)}
.badge[data-tone="neutral"]{background:var(--elevated);color:var(--muted)}
.badge[data-tone="success"]{background:var(--success-soft);color:var(--success)}
.badge[data-tone="warning"]{background:var(--warning-soft);color:var(--warning)}
.badge[data-tone="error"]{background:var(--error-soft);color:var(--error)}

button.btn{cursor:pointer;border:1px solid var(--line);background:var(--elevated);border-radius:var(--radius-sm);min-height:38px;padding:8px 14px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:600;font-size:13.5px;width:100%;transition:background var(--fast) var(--ease)}
button.btn:active{background:var(--raised)}
button.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
button.btn.ghost{background:transparent}
button.btn.danger{background:transparent;color:var(--error);border-color:color-mix(in srgb,var(--error) 45%,transparent)}
button.btn.sm{min-height:30px;padding:5px 11px;font-size:12.5px;width:auto}
.btn-row{display:flex;gap:8px}
.btn-row > button{flex:1}
.icon-btn{background:none;border:0;color:var(--muted);width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-btn:active{background:var(--hover)}

.field{width:100%;background:var(--field);border:1px solid var(--line-strong);border-radius:var(--radius-sm);padding:9px 11px;min-height:38px;color:var(--text)}
.field:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field::placeholder{color:var(--faint)}
.check-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;min-height:0}
.check-row:not(:last-child){border-bottom:1px solid var(--line)}
.check-row strong{font-size:13.5px;font-weight:550}
.check-row small{display:block;color:var(--muted);font-size:11.5px;margin-top:1px}
.switch{position:relative;width:44px;height:26px;border-radius:14px;background:var(--elevated);border:1px solid var(--line-strong);flex-shrink:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.4);transition:transform var(--fast) var(--ease)}
.switch[data-on="true"]{background:var(--success);border-color:transparent}
.switch[data-on="true"]::after{transform:translateX(18px)}

.segmented{display:inline-flex;padding:2px;border-radius:9px;background:var(--elevated);border:1px solid var(--line);gap:1px;width:100%}
.segmented button{flex:1;border:0;background:transparent;min-height:28px;padding:4px 6px;border-radius:7px;color:var(--muted);font-size:12px;font-weight:600}
.segmented button.selected{background:var(--raised);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.25)}

.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:44px 26px}
.empty .icon-lg{width:46px;height:46px;color:var(--faint);border:1px solid var(--line-strong);border-radius:50%;display:flex;align-items:center;justify-content:center}
.empty .icon-lg .icon{width:22px;height:22px}
.empty h3{font-size:14.5px;font-weight:650}
.empty p{font-size:12.5px;color:var(--muted);max-width:260px;line-height:1.5}

.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:var(--radius-sm);background:var(--elevated);border:1px solid var(--line-strong)}
.banner.warn{background:var(--warning-soft);border-color:transparent}
.banner.info{background:var(--accent-soft);border-color:transparent}
.banner.err{background:var(--error-soft);border-color:transparent}
.banner p{font-size:12px;line-height:1.5;color:var(--text)}
.banner strong{display:block;font-size:12.5px;margin-bottom:1px}

.avatar{width:32px;height:32px;border-radius:50%;background:var(--elevated);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--muted)}
.avatar.olive{background:var(--olive-glow);color:var(--olive);position:relative}
.avatar.olive::after{content:"";position:absolute;top:4px;right:4px;width:4px;height:4px;border-radius:50%;background:var(--pimento)}

/* ---------- overlay sheets / flows ---------- */
.overlay{position:absolute;inset:0;z-index:80;display:flex;flex-direction:column;background:var(--bg)}
.sheet-backdrop{position:absolute;inset:0;z-index:70;background:rgba(4,7,12,.55);display:flex;align-items:flex-end}
.sheet{position:relative;z-index:71;width:100%;max-height:88%;background:var(--surface);border-radius:20px 20px 0 0;border:1px solid var(--line-strong);border-bottom:0;box-shadow:0 -12px 30px rgba(0,0,0,.4);display:flex;flex-direction:column;overflow:hidden}
.sheet-grab{width:36px;height:4px;border-radius:3px;background:var(--line-strong);margin:9px auto 2px}
.sheet-head{padding:6px 16px 10px;flex-shrink:0}
.sheet-head h2{font-size:16px;font-weight:650}
.sheet-body{padding:0 16px 18px;overflow-y:auto}
.sheet-body::-webkit-scrollbar{width:0}

/* chat */
.msg-list{display:flex;flex-direction:column;gap:14px;padding:12px 14px 6px}
.msg{display:flex;gap:8px;max-width:100%}
.msg.user{flex-direction:row-reverse}
.bubble{max-width:78%;padding:9px 12px;border-radius:16px;font-size:13.5px;line-height:1.48}
.msg.user .bubble{background:var(--accent);color:var(--on-accent);border-bottom-right-radius:5px}
.msg.olive .bubble{background:var(--elevated);border:1px solid var(--line);border-bottom-left-radius:5px}
.attrib{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:650;color:var(--faint);margin:0 0 5px 40px}
.attrib .icon{width:11px;height:11px}
.code-block{background:var(--bg);border:1px solid var(--line);border-radius:10px;margin-top:8px;overflow:hidden}
.code-block .code-head{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);font-size:10.5px;color:var(--faint)}
.code-block pre{margin:0;padding:10px 12px;font-family:var(--mono);font-size:11.5px;line-height:1.55;overflow-x:auto;color:var(--text)}
.code-block .code-head button{margin-left:auto;background:none;border:0;color:var(--faint);font-size:10.5px;display:flex;align-items:center;gap:4px;padding:2px}
.cursor-blink{display:inline-block;width:6px;height:13px;background:var(--text);vertical-align:middle;margin-left:1px;animation:blink 1s step-end infinite}
@keyframes blink{50%{opacity:0}}
.chat-input-bar{flex-shrink:0;border-top:1px solid var(--line);padding:8px 10px;display:flex;flex-direction:column;gap:8px}
.chat-input-row{display:flex;align-items:flex-end;gap:8px}
.chat-input-row textarea{flex:1;resize:none;max-height:80px;border-radius:18px;padding:9px 14px}
.send-btn{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--on-accent);border:0;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.send-btn:disabled{opacity:.35}
.model-row{display:flex;align-items:center;gap:8px}
.model-picker{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:650;color:var(--muted);background:var(--elevated);border:1px solid var(--line);border-radius:999px;padding:4px 9px 4px 6px}
.convo-row .snippet{color:var(--muted);font-size:12px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* timeline */
.timeline{padding:8px 14px 4px;position:relative}
.tl-item{display:flex;gap:12px;position:relative;padding-bottom:16px}
.tl-item:last-child{padding-bottom:2px}
.tl-time{width:52px;flex-shrink:0;font-size:11px;font-weight:650;color:var(--muted);padding-top:2px;font-variant-numeric:tabular-nums}
.tl-rail{width:10px;display:flex;flex-direction:column;align-items:center;flex-shrink:0}
.tl-dot{width:9px;height:9px;border-radius:50%;background:var(--accent);margin-top:4px;flex-shrink:0;box-shadow:0 0 0 3px var(--accent-soft)}
.tl-dot.done{background:var(--faint);box-shadow:none}
.tl-dot.overdue{background:var(--error);box-shadow:0 0 0 3px var(--error-soft)}
.tl-line{flex:1;width:1.5px;background:var(--line-strong);margin-top:3px}
.tl-body{flex:1;min-width:0;padding-top:0}
.tl-body strong{display:block;font-size:13px;font-weight:600}
.tl-body small{color:var(--muted);font-size:11.5px}

/* swipe rows (Today timeline, Reminders) */
.swipe-row{position:relative;overflow:hidden;border-radius:10px}
.swipe-actions{position:absolute;top:0;right:0;bottom:0;display:flex;align-items:stretch}
.swipe-actions button{border:0;border-radius:0;min-width:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:650;color:#fff}
.swipe-actions .a-complete{background:var(--success)}
.swipe-actions .a-snooze{background:var(--warning);color:#3a2c05}
.swipe-actions .a-dismiss{background:var(--error)}
.swipe-content{position:relative;background:var(--bg);touch-action:pan-y;transition:transform var(--fast) var(--ease)}

/* devices */
.dev-icon{width:38px;height:38px;border-radius:11px;background:var(--elevated);display:flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0}
.cap-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.perm-row{display:flex;align-items:center;gap:10px;padding:11px 14px}
.perm-row:not(:last-child){border-bottom:1px solid var(--line)}
.perm-row .icon-btn{background:var(--elevated);color:var(--muted)}
.perm-name{flex:1;font-size:13.5px;font-weight:550}

/* qr / pairing */
.qr-frame{aspect-ratio:1;margin:20px 30px;border:2px dashed var(--line-strong);border-radius:22px;display:flex;align-items:center;justify-content:center;position:relative;background:var(--surface)}
.qr-frame .corner{position:absolute;width:26px;height:26px;border-color:var(--accent);border-style:solid;border-width:0}
.qr-frame .c1{top:10px;left:10px;border-top-width:3px;border-left-width:3px;border-radius:8px 0 0 0}
.qr-frame .c2{top:10px;right:10px;border-top-width:3px;border-right-width:3px;border-radius:0 8px 0 0}
.qr-frame .c3{bottom:10px;left:10px;border-bottom-width:3px;border-left-width:3px;border-radius:0 0 0 8px}
.qr-frame .c4{bottom:10px;right:10px;border-bottom-width:3px;border-right-width:3px;border-radius:0 0 8px 0}
.fingerprint-words{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:14px 10px}
.fp-word{background:var(--elevated);border:1px solid var(--line-strong);border-radius:9px;padding:9px 12px;font-family:var(--mono);font-weight:650;font-size:14px;letter-spacing:.02em}
.spinner{width:28px;height:28px;border-radius:50%;border:2.5px solid var(--line-strong);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.step-dots{display:flex;gap:6px;justify-content:center;padding:10px 0}
.step-dots span{width:6px;height:6px;border-radius:50%;background:var(--line-strong)}
.step-dots span.on{background:var(--accent)}

/* files */
.progress-track{height:5px;border-radius:3px;background:var(--elevated);overflow:hidden;margin-top:7px}
.progress-fill{height:100%;background:var(--accent);border-radius:3px}
.progress-fill.err{background:var(--error)}
.progress-fill.ok{background:var(--success)}
.file-icon{width:36px;height:36px;border-radius:9px;background:var(--elevated);display:flex;align-items:center;justify-content:center;color:var(--accent);flex-shrink:0}

/* studio */
.studio-toolbar{display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);flex-shrink:0}
.file-tree-row{display:flex;align-items:center;gap:8px;padding:9px 14px;font-size:13px}
.file-tree-row .icon{color:var(--faint)}
.file-tree-row.depth1{padding-left:30px}
.file-tree-row.depth2{padding-left:46px}
.editor-pane{background:var(--bg);margin:0 14px;border-radius:10px;border:1px solid var(--line);overflow:hidden}
.editor-pane pre{margin:0;padding:12px;font-family:var(--mono);font-size:11.5px;line-height:1.6;overflow-x:auto}
.ln{color:var(--faint);display:inline-block;width:20px;user-select:none}
.output-panel{background:#05070c;border-radius:10px;margin:10px 14px 0;padding:10px 12px;font-family:var(--mono);font-size:11px;line-height:1.65;color:#b9e6c4;max-height:150px;overflow-y:auto}
.output-panel .l-err{color:#ff9d9d}
.output-panel .l-warn{color:#f0c36b}
.output-panel .l-muted{color:#6f819a}

/* notification banner */
.notif-banner{position:absolute;top:14px;left:10px;right:10px;z-index:90;background:color-mix(in srgb,var(--raised) 96%,transparent);backdrop-filter:blur(10px);border:1px solid var(--line-strong);border-radius:16px;box-shadow:var(--shadow);padding:10px 12px;display:flex;gap:10px;align-items:flex-start}

/* ============================= CONTROL PANEL ============================= */
.panel{display:flex;flex-direction:column;gap:14px;position:sticky;top:20px}
@media (max-width:900px){.panel{position:static}}
.panel-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden}
.panel-card h4{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:13px 15px 8px}
.jump-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 10px 12px}
.jump-btn{display:flex;align-items:center;gap:8px;text-align:left;background:var(--elevated);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:12px;font-weight:600;min-height:0}
.jump-btn:hover{background:var(--raised)}
.jump-btn.on{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.jump-btn .icon{width:15px;height:15px;flex-shrink:0}
.sim-list{display:flex;flex-direction:column}
.sim-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 15px;font-size:12.5px;border-top:1px solid var(--line)}
.sim-row span{line-height:1.35}
.sim-note{padding:6px 15px 13px;font-size:11px;color:var(--faint);line-height:1.5}
.notes{padding:14px 15px 16px;font-size:12.5px;line-height:1.65;color:var(--muted)}
.notes h4{color:var(--text);font-size:13px;margin-bottom:4px}
.notes p{margin-bottom:10px}
.notes ul{margin:0 0 10px;padding-left:18px}
.notes li{margin-bottom:4px}
.small-switch{position:relative;width:34px;height:20px;border-radius:11px;background:var(--elevated);border:1px solid var(--line-strong);flex-shrink:0}
.small-switch::after{content:"";position:absolute;top:1.5px;left:1.5px;width:15px;height:15px;border-radius:50%;background:#fff;transition:transform var(--fast) var(--ease)}
.small-switch[data-on="true"]{background:var(--warning);border-color:transparent}
.small-switch[data-on="true"]::after{transform:translateX(14px)}

function devices(){
  let list = DATA.devices.filter(d=>d.status!=='waiting'||true);
  if (SIM.noDevices) list = list.filter(d=>d.status==='revoked');
  return list.map(d=>{
    let x = {...d};
    if (x.id==='gaming' && SIM.gamingOffline) x.status='offline';
    if (SIM.allOffline && x.status!=='waiting' && x.status!=='revoked') x.status='offline';
    if (SIM.aiDisabled) x.caps = {...x.caps, ai:'off'};
    if (SIM.studioUnavailable) x.caps = {...x.caps, studio:'off'};
    if (SIM.allBusy && x.status==='online' && x.caps.ai!=='off') x.status='busy';
    return x;
  });
}
function pairedDevices(){ return devices().filter(d=>d.status!=='waiting'&&d.status!=='revoked'); }
function waitingDevices(){ return devices().filter(d=>d.status==='waiting'); }
function revokedDevices(){ return devices().filter(d=>d.status==='revoked'); }
function aiDevices(){ return devices().filter(d=>d.caps.ai && d.caps.ai!=='off'); }
function byId(id){ return devices().find(d=>d.id===id); }

function statusPill(d){
  const map = { online:['online','Online'], busy:['busy',d.busyNote?'Busy':'Busy'], offline:['offline','Offline'], waiting:['waiting','Waiting'], revoked:['revoked','Revoked'] };
  const [tone,label] = map[d.status];
  return `<span class="pill" data-tone="${tone}"><span class="dot"></span>${label}</span>`;
}

const ROOT_SCREEN = { home:'root', chat:'list', today:'root', devices:'list', files:'root', settings:'root' };
function stackTop(tab){ const st=S.stacks[tab]; return st[st.length-1]; }
function push(tab,screen,params){ S.stacks[tab].push({s:screen,...params}); render(); }
function pop(tab){ if (S.stacks[tab].length>1) S.stacks[tab].pop(); render(); }
function goTab(tab){ S.tab=tab; closeAllOverlays(); render(); }
function openOverlay(type,params){ S.overlayStack.push({type, ...(params||{})}); render(); }
function closeOverlay(){ S.overlayStack.pop(); render(); }
function closeAllOverlays(){ S.overlayStack=[]; }
/* jump() is for entry points that should discard a tab's existing history: switching
   tabs from elsewhere, or completing a flow (pairing) that shouldn't stay in back-stack.
   Same-tab drill-downs use push()/pop() so the back chevron behaves normally. */
function jump(tab,screen,params){
  const root = ROOT_SCREEN[tab];
  const target = screen || root;
  S.stacks[tab] = target===root ? [{s:root, ...(params||{})}] : [{s:root},{s:target,...(params||{})}];
  S.tab = tab;
  closeAllOverlays();
  render();
}

function setPreset(p){ S.chatPreset=p; S.chatDevice=null; S.chatPhase='idle'; render(); }
function pickRunOnDevice(devId){ S.chatDevice=devId; closeOverlay(); render(); }
function chatKeyboardOpen(open){
  const bar = document.querySelector('.chat-input-bar');
  if (bar) bar.style.paddingBottom = open? '2px' : '8px';
}
function sendChat(){
  const phase = S.chatPhase || 'idle';
  if (phase!=='idle' && phase!=='done') return;
  const preset = S.chatPreset || 'NORMAL';
  const avail = chatDeviceOptions(preset);
  const chosen = avail.find(d=>d.id===S.chatDevice) || avail[0];
  if (!chosen) return;
  S.chatChosenId = chosen.id;
  if (chosen.caps.ai==='ask'){
    S.chatPhase = 'waiting-approval';
    render();
  } else {
    beginThinking(chosen, preset);
  }
}
function cancelChatRequest(){ S.chatPhase='idle'; render(); }
function approveChatRequest(){
  const preset = S.chatPreset || 'NORMAL';
  const chosen = byId(S.chatChosenId);
  if (!chosen) { S.chatPhase='idle'; render(); return; }
  beginThinking(chosen, preset);
}
function beginThinking(chosen, preset){
  S.chatPhase = 'thinking';
  render();
  clearTimeout(window.__olthink);
  window.__olthink = setTimeout(()=>{
    if (S.chatPhase==='thinking') startStreamingResponse(chosen, preset);
  }, 900);
}
function startStreamingResponse(chosen, preset){
  S.chatPhase = 'streaming';
  S.chatAnsweredBy = chosen.name;
  S.chatAnsweredPreset = preset;
  S.streamText = '';
  render();
  const full = 'Sure \u2014 here\u2019s a quick summary based on the paired device\u2019s context.';
  let i=0;
  clearInterval(window.__olstream);
  window.__olstream = setInterval(()=>{
    i+=3; S.streamText = full.slice(0,i);
    const done = i>=full.length;
    // Patch the streaming bubble directly instead of a full render() each tick,
    // so scroll position, input focus and the tab bar don't reset every 40ms.
    const t = document.getElementById('streamText');
    if (t && !done){
      t.textContent = S.streamText;
    } else {
      if (done) S.chatPhase='done';
      render();
    }
    if (done) clearInterval(window.__olstream);
  },40);
}
function stopStreaming(){ clearInterval(window.__olstream); clearTimeout(window.__olthink); S.chatPhase='done'; render(); }
function escapeHtml(s){ return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

    <div class="swipe-content" data-open="0">${innerHtml}</div>
  </div>`;
}
function completeTask(id){ const t=DATA.tasks.find(x=>x.id===id); if(t) t.done=true; render(); }
function snoozeReminder(id){ const r=DATA.reminders.find(x=>x.id===id); if(r){ r.state='snoozed'; r.when='Snoozed until tomorrow'; } render(); }
function dismissReminder(id){ const r=DATA.reminders.find(x=>x.id===id); if(r){ r.state='done'; r.when='Dismissed'; } render(); }

    {time:'9:00 PM', kind:'event', id:'e2', title:'Studio PC maintenance window'},
  ].filter(it=>{
    if (it.kind==='task'){ const t=DATA.tasks.find(x=>x.id===it.id); return t && !t.done; }
    if (it.kind==='reminder'){ const r=DATA.reminders.find(x=>x.id===it.id); return r && r.state!=='done'; }
    return true;
  });
  const overdue = DATA.tasks.filter(t=>t.overdue);
  return `
  <div class="nav-title-big"><h1>Today</h1><div class="muted" style="font-size:12.5px;margin-top:2px">${todayStr()}</div></div>
  <div class="section" style="padding-bottom:0">

      <button class="btn ghost sm" onclick="push('today','tasks')">${ic('flag',13)} Tasks</button>

    </div>
  </div>
  ${overdue.length? `<div class="section"><div class="banner warn">${ic('alert',15)}<div><strong>${overdue.length} overdue</strong><p>${overdue[0].title}</p></div></div></div>`:''}
  <div class="timeline">
    ${items.length? items.map((it,idx)=>{
      const rowHtml = `<div class="tl-item" style="padding-bottom:${idx<items.length-1?16:2}px">
        <div class="tl-time">${it.time}</div>
        <div class="tl-rail"><div class="tl-dot"></div>${idx<items.length-1?'<div class="tl-line"></div>':''}</div>
        <div class="tl-body"><strong>${it.title}</strong><small>${it.sub? it.sub+' \u00b7 ':''}${it.kind==='task'?'Task':it.kind==='event'?'Calendar':'Reminder'}</small></div>
      </div>`;
      let actions = [];
      if (it.kind==='task') actions = [{label:'Complete',cls:'a-complete',onclick:`completeTask('${it.id}')`}];

  ${S.studioShowConflict? `
  <div class="section" style="padding-top:8px"><div class="banner err">${ic('alert',15)}<div><strong>This file changed on ${device.name}.</strong><p style="font-size:12px">A newer revision was saved while you were editing. Saving now would silently overwrite it.</p></div></div>
    <div class="btn-row" style="margin-top:8px"><button class="btn ghost sm" onclick="reloadStudioFile('${wsId}')">${ic('refresh',13)} Reload</button><button class="btn ghost sm" onclick="keepLocalDraft()">Keep local draft</button></div>
  </div>` : (offline && S.studioDirty)? `
  <div class="section" style="padding-top:8px"><div class="banner warn">${ic('wifiOff',15)}<div><strong>Unsaved local draft</strong><p style="font-size:12px">${device.name} is offline, so this edit only exists on this iPhone \u2014 it hasn\u2019t been saved remotely. Its revision will be checked again once ${device.name} reconnects.</p></div></div></div>
  `:''}
  <div class="editor-pane" style="margin:10px 14px 0">
    ${S.studioEditing?
      `<textarea class="field mono" style="width:100%;min-height:140px;border:0;border-radius:0;background:transparent;font-family:var(--mono);font-size:11.5px;line-height:1.6;padding:12px" oninput="onStudioEdit(this.value)">${escapeHtml(S.studioDraftText)}</textarea>`
      : `<pre>${S.studioDraftText.split('\n').map((l,i)=>`<span class="ln">${i+1}</span>${escapeHtml(l)}`).join('\n')}</pre>`}
  </div>
  <div class="studio-toolbar">
    ${S.studioEditing? `<button class="btn ghost sm" onclick="stopEditingStudioFile()">${ic('checkCircle',13)} Done editing</button>` : `<button class="btn ghost sm" onclick="startEditingStudioFile()">${ic('edit',13)} Edit</button>`}
    <button class="btn ghost sm" ${(!S.studioDirty||offline)?'disabled':''} onclick="saveStudioFile('${wsId}')">${ic('checkCircle',13)} Save</button>
    <button class="btn ghost sm" ${!ws.build?'disabled':''} onclick="runStudio('build','${wsId}')">${ic('hammer',13)} Build</button>
    <button class="btn ghost sm" ${!ws.test?'disabled':''} onclick="runStudio('test','${wsId}')">${ic('beaker',13)} Test</button>
    <button class="btn ghost sm" ${!ws.run?'disabled':''} onclick="runStudio('run','${wsId}')">${ic('play',13)} Run</button>
  </div>
  ${!ws.build? `<div class="section" style="padding-top:0"><p class="faint" style="font-size:11px">Build, Test and Run aren\u2019t available for this workspace \u2014 it isn\u2019t a buildable project.</p></div>`:''}
  ${S.studioOutput.length? `
  <div class="output-panel" id="studioOut">${S.studioOutput.map(l=>`<div class="${l.cls}">${l.t}</div>`).join('')}</div>
  <div class="section" style="padding:10px 14px 16px">${running? `<button class="btn ghost sm" onclick="stopStudio()">${ic('square',13)} Stop</button>` : ''}</div>
  ` : `<div style="height:16px"></div>`}
  `;
}
function onStudioEdit(v){ S.studioDraftText=v; S.studioDirty=true; }
function startEditingStudioFile(){ S.studioEditing=true; render(); }
function stopEditingStudioFile(){ S.studioEditing=false; render(); }
function saveStudioFile(wsId){
  const ws = DATA.studioWorkspaces[wsId];
  const device = byId(ws.device);
  if (!S.studioDirty || (device && device.status==='offline')) return;
  if (SIM.studioConflict){ S.studioShowConflict=true; render(); return; }
  S.studioDirty=false; S.studioEditing=false; render();
}
function reloadStudioFile(wsId){
  const ws = DATA.studioWorkspaces[wsId];
  S.studioDraftText=ws.code; S.studioDirty=false; S.studioShowConflict=false; S.studioEditing=false; render();
}
function keepLocalDraft(){ S.studioShowConflict=false; render(); }
function runStudio(kind, wsId){
  const ws = DATA.studioWorkspaces[wsId];
  if (!ws[kind]) return;
  const device = byId(ws.device);
  clearInterval(outputTimer);
  S.studioOutput = [{t:`$ olive ${kind} \u00b7 running on ${device?device.name:'remote device'}`, cls:'l-muted'}];
  S.studioRunning = true;
  let lines;
  if (kind==='test'){
    const t = ws.test;
    lines = [[`${t.passed} passed \u00b7 ${t.failed} failed \u00b7 ${t.skipped} skipped \u00b7 ${t.duration}`, t.failed>0?'l-err':''], ...t.lines];
  } else {
    lines = ws[kind];
  }
  let i=0;
  outputTimer = setInterval(()=>{
    if (i>=lines.length){ clearInterval(outputTimer); S.studioRunning=false; render(); return; }
    S.studioOutput.push({t:lines[i][0], cls:lines[i][1]});
    i++; render();
  },550);
  render();
}
function stopStudio(){ clearInterval(outputTimer); S.studioRunning=false; S.studioOutput.push({t:'Stopped by user',cls:'l-warn'}); render(); }

      pair: { title:'Confirm pairing', icon:'fingerprint', verb:'wants to pair as a trusted device.', capability:'Device pairing', target:'This iPhone' },
      file: { title:'Incoming file', icon:'download', verb:'wants to send a file to this iPhone.', capability:'File transfer \u00b7 Receive Files', target:o.file||'a file' },
      ai: { title:'Remote AI request', icon:'chat', verb:'wants to run OLIVE '+(o.preset||'MAX')+' for this conversation.', capability:'Remote AI \u00b7 '+(o.preset||'MAX'), target:'This conversation' },
      studio: { title:'Remote Studio request', icon:'terminal', verb:'wants Remote Studio access.', capability:'Remote Studio', target:o.workspace||'a shared workspace' },
      sync: { title:'Sync request', icon:'refresh', verb:'wants to sync records.', capability:'Tasks & Calendar Sync', target:o.target||'3 items' },
    };
    const meta = kindMeta[o.kind] || kindMeta.ai;
    return `
    <div class="sheet-grab"></div><div class="sheet-head"><h2>${meta.title}</h2></div>
    <div class="sheet-body stack">
      <div class="banner info">${ic(meta.icon,16)}<div><strong>${o.device}</strong><p style="font-size:12px">${meta.verb}</p></div></div>
      <div class="row spread"><span class="muted small">Capability</span><span>${meta.capability}</span></div>
      <div class="row spread"><span class="muted small">Target</span><span>${meta.target}</span></div>
      <div class="btn-row"><button class="btn danger" onclick="closeOverlay()">Deny</button><button class="btn primary" onclick="closeOverlay()">Allow once</button></div>
      <button class="btn ghost sm" style="width:100%;color:var(--muted)" onclick="${o.deviceId?`goToPermissions('${o.deviceId}')`:'closeOverlay()'}">Manage this device\u2019s permissions instead \u2192</button>
    </div>`;
  }
  if (o.type==='runOn'){
    const preset = o.preset;
    const avail = chatDeviceOptions(preset);
    const others = devices().filter(d=>d.status!=='waiting'&&d.status!=='revoked'&&!avail.includes(d));
    return `
    <div class="sheet-grab"></div><div class="sheet-head"><h2>Run on</h2></div>
    <div class="sheet-body stack">
      ${avail.length? avail.map(d=>`<button class="card-row" style="width:100%;background:var(--elevated);border-radius:10px;margin-bottom:6px" onclick="pickRunOnDevice('${d.id}')"><span class="dev-icon">${devIcon(d)}</span><div class="spacer"><strong>${d.name}</strong><small>${d.caps.ai==='ask'?'Will ask before each request':statusText(d)}</small></div>${statusPill(d)}</button>`).join('') : `<p class="muted" style="font-size:12.5px">No paired device currently shares OLIVE ${preset}.</p>`}
      ${others.length? `<div class="eyebrow" style="padding:10px 2px 6px">Not available for ${preset}</div>${others.map(d=>`<div class="card-row" style="opacity:.5"><span class="dev-icon">${devIcon(d)}</span><div class="spacer"><strong>${d.name}</strong><small>${d.caps.ai==='off'?'Remote AI Off':'Doesn\u2019t offer '+preset}</small></div></div>`).join('')}`:''}
      <div class="card-row" style="opacity:.45"><span class="dev-icon">${ic('phone',18)}</span><div class="spacer"><strong>This iPhone</strong><small>Local AI unavailable</small></div></div>
      <button class="btn ghost" onclick="closeOverlay()">Close</button>
    </div>`;
  }
  return '';
}
function doRevoke(id){ const d=DATA.devices.find(x=>x.id===id); d.status='revoked'; closeOverlay(); jump('devices','list'); }
function goToPermissions(id){ closeOverlay(); jump('devices','detail',{id}); }
function deviceIdByName(name){ const d=DATA.devices.find(x=>x.name===name); return d?d.id:''; }

/* ============================================================ RENDER ============================================================ */
function screenFor(tab){
  const t = stackTop(tab);
  if (tab==='home') return screenHome();
  if (tab==='chat') return t.s==='thread'? screenChatThread(t.id) : screenChatList();
  if (tab==='today'){
    if (t.s==='tasks') return screenTasks();
    if (t.s==='calendar') return screenCalendar();
    if (t.s==='reminders') return screenReminders();
    return screenToday();
  }
  if (tab==='devices'){
    if (t.s==='detail') return screenDeviceDetail(t.id);
    if (t.s==='pair-start') return screenPairStart();
    if (t.s==='pair-qr') return screenPairQr();
    if (t.s==='pair-code') return screenPairCode();
    if (t.s==='pair-connecting') return screenPairConnecting();
    if (t.s==='pair-confirm') return screenPairConfirm();
    if (t.s==='pair-waiting') return screenPairWaiting();
    if (t.s==='pair-success') return screenPairSuccess();
    if (t.s==='pair-mismatch') return screenPairMismatch();
    if (t.s==='pair-expired') return screenPairExpired();
    if (t.s==='pair-cancelled') return screenPairCancelled();
    if (t.s==='pair-connection-lost') return screenPairConnectionLost();
    if (t.s==='pair-denied') return screenPairDenied();
    if (t.s==='studio-workspaces') return screenRemoteWorkspaces();
    if (t.s==='studio-workspace') return screenStudioWorkspace(t.id);
    if (t.s==='studio-file') return screenStudioFile(t.id);
    return screenDeviceList();
  }
  if (tab==='files') return screenFiles();
  if (tab==='settings') return screenSettings();
  return '';
}
const TABS = [
  ['home','Home','home'],['chat','Chat','chat'],['today','Today','today'],
  ['devices','Devices','devices'],['files','Files','files'],
];
function render(){
  const el = document.getElementById('screen');
  const showOverlay = S.overlayStack.length>0;
  el.innerHTML = `
    <div class="statusbar"><span>9:41</span><span class="sb-icons">${ic('wifi',13)}<span style="font-weight:700">100%</span></span></div>
    <div class="screen-body">${screenFor(S.tab)}</div>
    <div class="tabbar">
      ${TABS.map(([key,label,icon])=>`<button class="${S.tab===key?'active':''}" onclick="goTab('${key}')">${ic(icon,21)}<span>${label}</span></button>`).join('')}
    </div>
    <div class="home-indicator"></div>
    ${S.banner? `
    <div class="notif-banner">
      <span class="avatar olive" style="width:28px;height:28px">${ic('chat',13)}</span>
      <div class="spacer"><strong style="font-size:12.5px;display:block">${S.banner.title}</strong><small class="muted" style="font-size:11.5px">${S.banner.body}</small></div>
      <button class="icon-btn" style="width:22px;height:22px" onclick="dismissBanner(event)">${ic('x',12)}</button>
    </div>`:''}
    ${showOverlay? `<div class="sheet-backdrop" onclick="closeOverlay()"><div class="sheet" onclick="event.stopPropagation()">${overlayContent(S.overlayStack[S.overlayStack.length-1])}</div></div>` : ''}
  `;
  if (S.banner){
    el.querySelector('.notif-banner').addEventListener('click',()=>{ S.overlayStack.push(S.banner.overlay); S.banner=null; render(); });
  }
  renderPanel();
}
function dismissBanner(ev){ ev.stopPropagation(); S.banner=null; render(); }

/* ============================================================ CONTROL PANEL ============================================================ */
const JUMPS = [
  ['home','Home','home',null],
  ['chat','Chat list','chat','list'],
  ['chat','Chat thread','chat','thread',{id:'c2'}],
  ['today','Today','today','root'],
  ['today','Tasks','today','tasks'],
  ['today','Calendar','today','calendar'],
  ['today','Reminders','today','reminders'],
  ['devices','Devices','devices','list'],
  ['devices','Device detail','devices','detail',{id:'gaming'}],
  ['devices','Pairing: start','devices','pair-start'],
  ['devices','Pairing: mismatch','devices','pair-mismatch'],
  ['devices','Pairing: expired','devices','pair-expired'],
  ['devices','Pairing: cancelled','devices','pair-cancelled'],
  ['devices','Pairing: connection lost','devices','pair-connection-lost'],
  ['devices','Pairing: denied','devices','pair-denied'],
  ['devices','Remote Studio','devices','studio-workspaces'],
  ['devices','Studio: RaceDay file','devices','studio-file',{id:'raceday'}],
  ['files','Files','files','list'],
  ['settings','Settings','settings','root'],
];
function renderPanel(){
  const el = document.getElementById('panel');
  el.innerHTML = `
    <div class="panel-card">
      <h4>Jump to screen</h4>
      <div class="jump-grid">
        ${JUMPS.map((j,idx)=>`<button class="jump-btn ${S.tab===j[0]?'on':''}" onclick="jumpFromPanel(${idx})">${ic(j[0],14)} ${j[1]}</button>`).join('')}
        <button class="jump-btn" onclick="simulateApproval()">${ic('bell',14)} Incoming request</button>
      </div>
    </div>
    <div class="panel-card">
      <h4>Simulate states</h4>
      <div class="sim-list">
        ${simRow('Connect on','connectOn')}
        ${simRow('No paired devices','noDevices')}
        ${simRow('No nearby devices','noNearby')}
        ${simRow('No devices online','allOffline')}
        ${simRow('No chat history','noChatHistory')}
        ${simRow('Nothing due today','noTasksToday')}
        ${simRow('Gaming PC offline','gamingOffline')}
        ${simRow('Remote AI off on all devices','aiDisabled')}
        ${simRow('All Remote AI devices busy','allBusy')}
        ${simRow('Stale synced data banner','staleSync')}
        ${simRow('Remote Studio unavailable','studioUnavailable')}
        ${simRow('Remote file revision conflict','studioConflict')}
      </div>
      <div class="sim-note">These toggles drive the same screens live \u2014 offline, revoked, permission-off and empty states are real render states, not separate mockups. Diego\u2019s Studio PC\u2019s Remote AI defaults to Ask, so Chat already demonstrates that state without a toggle.</div>
    </div>
    <div class="panel-card">
      <h4>Implementation handoff</h4>
      <div class="notes">
        <h4>Information architecture</h4>
        <p>Five permanent tabs: Home, Chat, Today, Devices, Files. Settings is not a tab \u2014 it's reached via a gear icon on Home and on Devices, presented with a "Done" dismiss rather than a back chevron, since it's an occasional destination, not a daily one. Remote AI lives inside Chat (Model + Run on) rather than its own tab. Remote Studio and Pairing are drill-ins from Devices.</p>
        <h4>Final bottom-tab structure</h4>
        <ul><li>Home \u2014 dashboard</li><li>Chat \u2014 list + thread</li><li>Today \u2014 unified agenda, drills into Tasks / Calendar / Reminders</li><li>Devices \u2014 list, detail, pairing, Remote Studio</li><li>Files \u2014 OLIVE Inbox</li></ul>
        <h4>Screen inventory</h4>
        <p>Home; Chat list/thread; Today, Tasks, Calendar, Reminders; Devices list, device detail, Remote Studio workspaces/workspace/file; pairing (start, QR, code, connecting, confirm, waiting, success, mismatch, expired, cancelled, connection-lost, denied); Files list; Settings; sheets for task/event/reminder/file/share/approval/run-on/revoke/this-device.</p>
        <h4>Reusable components</h4>
        <p><code>.card</code> / <code>.card-row</code> lists, <code>.pill</code> status (online/busy/offline/waiting/revoked), <code>.badge</code> tags, <code>.segmented</code> control, <code>.switch</code> toggle, bottom <code>.sheet</code>, <code>.banner</code> (info/warn/err), <code>.timeline</code> agenda rows, <code>.swipe-row</code> quick actions, <code>.output-panel</code> bounded log.</p>
        <h4>Typography</h4>
        <p>iOS system font stack (no custom webfont). Large title 26px/700 for tab roots; nav title 16.5px/650; card titles 13.5px/600; supporting text 11.5\u201312.5px muted; eyebrows 10.5px/700 uppercase tracked.</p>
        <h4>Spacing & radius</h4>
        <p>14/9/20px radius scale (card / control / sheet). Section padding 14px sides, list rows 44px min height for touch targets, 8\u201310px stack gaps.</p>
        <h4>Status colour semantics</h4>
        <p>Success green = Online/Verified/Allow-passed. Warning amber = Busy/Ask-pending/interrupted-but-recoverable. Error red = Offline-that-blocks/Failed/Revoked action. Neutral grey = Off/Declined/inactive. Accent blue is interaction only, never status.</p>
        <h4>Navigation patterns</h4>
        <p>Per-tab back-stacks with <code>push()</code>/<code>pop()</code> for drill-downs; <code>jump()</code> resets a tab's stack for cross-tab entry points and for flows that shouldn't leave a re-enterable history (finishing or abandoning pairing).</p>
        <h4>Sheet / modal patterns</h4>
        <p>Bottom sheets for detail + approvals; approvals lead with Deny / Allow once, with "manage this device's permissions instead" visually de-emphasized below a divider rather than offering one-tap permanent Allow.</p>
        <h4>Capability state presentation</h4>
        <p>Every capability (Remote AI, Tasks & Calendar Sync, Chat continuity, Receive Files, Send Files, Remote Studio) is Off / Ask / Allow per device, shown as a 3-way segmented control on Device Detail \u2014 the single source of truth every other screen reads from.</p>
        <h4>Responsive / safe-area behavior</h4>
        <p>Phone frame scales via <code>min(390px, 100vw \u2212 32px)</code> with a locked aspect ratio; status bar/tab bar respect notch and home-indicator space; sheets are full-width bottom sheets, not centered dialogs; Chat's input bar tightens padding on keyboard focus.</p>
        <h4>Deliberately unavailable in C9</h4>
        <ul>
          <li>No local model fallback \u2014 the iPhone never claims to run FAST/NORMAL/MAX itself; a disabled "This iPhone \u00b7 Local AI unavailable" row makes that explicit in the Run-on picker.</li>
          <li>No remote terminal, PTY, debugger, LSP, package installation or unrestricted filesystem in Remote Studio \u2014 bounded file browser, lightweight edit, revision-checked save, Build/Test/Run only.</li>
          <li>No "Allow always" on first contact \u2014 approvals default to Deny / Allow once; permanent grants happen in Devices.</li>
          <li>No internet relay \u2014 everything here assumes the existing local pairing/transport from C1\u2013C8.</li>
        </ul>
      </div>
    </div>
  `;
}
function simRow(label,key){
  return `<div class="sim-row"><span>${label}</span><div class="small-switch" data-on="${SIM[key]}" onclick="toggleSim('${key}')"></div></div>`;
}
function toggleSim(key){ SIM[key]=!SIM[key]; render(); }
function jumpFromPanel(idx){
  const j = JUMPS[idx];
  jump(j[0], j[3]||null, j[4]||{});
}
function simulateApproval(){
  S.banner = { title:'Gaming PC', body:'wants to send a file to this iPhone', overlay:{type:'approval',kind:'file',device:'Gaming PC',deviceId:'gaming',file:'road-notes.png'} };
  render();
}

/* ============================================================ SWIPE ACTIONS ============================================================ */
/* Delegated on document (not per-row) because render() replaces #screen's
   innerHTML wholesale on every state change, which would otherwise drop
   per-element listeners. */
(function(){
  let dragRow=null, startX=0, startY=0, dx=0, startOpen=0, dragging=false, decided=false;
  function actionsWidth(row){ const a=row.querySelector('.swipe-actions'); return a? a.getBoundingClientRect().width : 0; }
  document.addEventListener('pointerdown', e=>{
    const row = e.target.closest && e.target.closest('.swipe-row');
    if (!row || e.target.closest('.swipe-actions')) return;
    dragRow = row; startX = e.clientX; startY = e.clientY; dx = 0; dragging=false; decided=false;
    const c = row.querySelector('.swipe-content');
    startOpen = parseFloat(c.dataset.open||'0');
  });
  document.addEventListener('pointermove', e=>{
    if (!dragRow) return;
    const moveX = e.clientX-startX, moveY = e.clientY-startY;
    if (!decided){
      if (Math.abs(moveX)<6 && Math.abs(moveY)<6) return;
      decided = true;
      dragging = Math.abs(moveX) > Math.abs(moveY);
      if (!dragging){ dragRow=null; return; }
    }
    if (!dragging) return;
    e.preventDefault();
    const max = actionsWidth(dragRow);
    dx = Math.max(-max, Math.min(0, startOpen+moveX));
    dragRow.querySelector('.swipe-content').style.transform = `translateX(${dx}px)`;
  });
  function endDrag(){
    if (!dragRow || !dragging){ dragRow=null; return; }
    const c = dragRow.querySelector('.swipe-content');
    const max = actionsWidth(dragRow);
    const finalX = (max && Math.abs(dx) > max*0.4) ? -max : 0;
    c.style.transform = `translateX(${finalX}px)`;
    c.dataset.open = finalX;
    dragRow=null; dragging=false;
  }
  document.addEventListener('pointerup', endDrag);
  document.addEventListener('pointercancel', endDrag);
})();

render();
</script>
